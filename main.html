<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイブボンバー：メインステージ</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif; 
            text-align: center; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        /* 問題表示エリア */
        #q-area { 
            background: rgba(20,20,20,0.95); 
            padding: 30px; 
            border-bottom: 5px solid #f1c40f; 
            z-index: 10; 
            position: relative; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        #q-title { 
            font-size: 45px; 
            font-weight: bold; 
            color: #f1c40f; 
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        
        /* タイマー表示 */
        #timer-area { 
            position: absolute; 
            top: 130px; 
            right: 40px; 
            z-index: 10; 
            border: 3px solid #ff3e3e; 
            padding: 10px 20px; 
            border-radius: 15px; 
            background: rgba(0,0,0,0.8); 
        }
        #timer { 
            font-size: 90px; 
            color: #ff3e3e; 
            font-weight: bold; 
            font-family: 'Courier New', monospace; 
            margin: 0;
        }
        
        /* 解答枠（1〜5） */
        .boxes { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            position: absolute; 
            bottom: 80px; 
            width: 100%; 
            z-index: 10; 
        }
        .answer-box {
            width: 180px; 
            height: 120px; 
            border: 4px solid #444; 
            background: #111;
            font-size: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-radius: 15px; 
            transition: 0.3s; 
            color: #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        /* 正解時の光る演出 */
        .correct { 
            background: linear-gradient(145deg, #f1c40f, #e67e22); 
            color: #fff !important; 
            border-color: #fff; 
            box-shadow: 0 0 40px #f1c40f, inset 0 0 10px white;
            transform: scale(1.05);
        }

        /* 爆弾のデザインと動き */
        #bomb-container {
            position: absolute;
            width: 200px; /* この幅の半分(100)を計算で使用 */
            height: 200px;
            z-index: 5;
            /* 左右のスライドはスムーズに、上下の落下はリニアに */
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.1s linear; 
        }
        #bomb-body {
            font-size: 180px;
            line-height: 200px;
            animation: beat 0.8s infinite alternate;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
        }
        
        /* 鼓動（ドクドク）アニメーション */
        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 40px red); }
        }

        /* 爆発時のオーバーレイ */
        #bomb-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(200,0,0,0.9); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #bomb-text { 
            font-size: 180px; 
            color: #f1c40f; 
            font-weight: bold; 
            transform: rotate(-10deg); 
            text-shadow: 10px 10px 0px #000;
            animation: shake 0.1s infinite;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(-10deg); }
            100% { transform: translate(-2px, -2px) rotate(-10deg); }
        }
    </style>
</head>
<body>

    <div id="q-area">
        <div id="q-title">READY...</div>
    </div>

    <div id="timer-area">
        <div id="timer">30</div>
    </div>

    <div id="bomb-container">
        <div id="bomb-body">💣</div>
    </div>

    <div class="boxes" id="box-container"></div>
    
    <div id="bomb-overlay">
        <div id="bomb-text">BOMB!! 💣</div>
    </div>

    <script>
        let currentTargetIdx = 1; 
        let totalQuestions = 5;
        
        // ★位置の微調整用変数
        const startY = 80;  // 開始時の高さ
        // 爆発ライン（画面の下からどれくらい離すか。450だと枠の少し上になります）
        const deadLineY = window.innerHeight - 450; 

        function updateBombPosition(timeLeft) {
            const bomb = document.getElementById('bomb-container');
            const targetBox = document.getElementById('box' + currentTargetIdx);
            
            if (targetBox) {
                const rect = targetBox.getBoundingClientRect();
                
                // 【横位置計算】
                // 枠の左端(rect.left) + 枠の幅の半分(rect.width/2) - 爆弾の幅の半分(100)
                const targetX = rect.left + (rect.width / 2) - 100; 
                bomb.style.left = targetX + 'px';

                // 【縦位置計算】
                const progress = (30 - timeLeft) / 30; // 0.0(開始)〜1.0(終了)
                const currentY = startY + (deadLineY - startY) * progress;
                bomb.style.top = currentY + 'px';
            }
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d.type === 'setup') {
                document.getElementById('q-title').innerText = d.title;
                const container = document.getElementById('box-container');
                container.innerHTML = '';
                totalQuestions = d.count;
                currentTargetIdx = 1; 
                for(let i=1; i<=d.count; i++) {
                    container.innerHTML += `<div class="answer-box" id="box${i}">${i}</div>`;
                }
                document.getElementById('bomb-overlay').style.display = 'none';
                document.getElementById('timer').innerText = "30";
                document.getElementById('bomb-container').style.display = 'block';
                
                // 少し遅らせて1人目の位置へ移動（要素が描画されるのを待つため）
                setTimeout(() => updateBombPosition(30), 100); 

            } else if (d.type === 'tick') {
                document.getElementById('timer').innerText = d.time;
                updateBombPosition(d.time);

            } else if (d.type === 'correct') {
                const box = document.getElementById('box' + d.num);
                if (box) box.classList.add('correct');
                
                // 次の人へ移動
                if (d.num < totalQuestions) {
                    currentTargetIdx = d.num + 1;
                    const currentTime = parseInt(document.getElementById('timer').innerText);
                    updateBombPosition(currentTime);
                } else {
                    // 全員正解！爆弾を上に消す
                    document.getElementById('bomb-container').style.transition = 'top 0.5s ease-in';
                    document.getElementById('bomb-container').style.top = '-300px';
                }

            } else if (d.type === 'bomb') {
                document.getElementById('bomb-container').style.display = 'none';
                document.getElementById('bomb-overlay').style.display = 'flex';

            } else if (d.type === 'reset') {
                location.reload(); 
            }
        });

        // ウィンドウサイズが変わったときにも位置を補正
        window.onresize = () => {
            const currentTime = parseInt(document.getElementById('timer').innerText);
            updateBombPosition(currentTime);
        };
    </script>
</body>
</html>
