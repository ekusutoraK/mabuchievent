<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイブボンバー：メインステージ</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; height: 100vh; }
        
        #q-area { background: rgba(20,20,20,0.9); padding: 30px; border-bottom: 4px solid #f1c40f; z-index: 10; position: relative; }
        #q-title { font-size: 45px; font-weight: bold; color: #f1c40f; }
        
        #timer-area { position: absolute; top: 120px; right: 30px; z-index: 10; border: 2px solid #ff3e3e; padding: 10px; border-radius: 10px; background: #000; }
        #timer { font-size: 80px; color: #ff3e3e; font-weight: bold; font-family: monospace; }
        
        .boxes { display: flex; justify-content: center; gap: 30px; position: absolute; bottom: 80px; width: 100%; z-index: 10; }
        .answer-box {
            width: 160px; height: 110px; border: 4px solid #444; background: #222;
            font-size: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; transition: 0.3s; color: #555;
        }
        .correct { background: linear-gradient(145deg, #f1c40f, #e67e22); color: #fff; border-color: #fff; box-shadow: 0 0 30px #f1c40f; }

        /* ★爆弾のデザインと動き */
        #bomb-container {
            position: absolute;
            width: 200px;
            height: 200px;
            z-index: 5;
            /* スライド（左右）はスムーズに、落下（上下）はリニアに */
            transition: left 0.4s ease-out, top 0.1s linear; 
        }
        #bomb-body {
            font-size: 180px;
            line-height: 200px;
            animation: beat 0.8s infinite alternate;
        }
        @keyframes beat {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px red); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 40px red); }
        }

        #bomb-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,0,0,0.9); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #bomb-text { font-size: 150px; color: yellow; font-weight: bold; transform: rotate(-10deg); text-shadow: 10px 10px #000; }
    </style>
</head>
<body>

    <div id="q-area"><div id="q-title">READY...</div></div>
    <div id="timer-area"><div id="timer">30</div></div>

    <div id="bomb-container"><div id="bomb-body">💣</div></div>

    <div class="boxes" id="box-container"></div>
    
    <div id="bomb-overlay"><div id="bomb-text">BOMB!! 💣</div></div>

    <script>
        let currentTargetIdx = 1; // 今答えている人の番号
        let totalQuestions = 5;
        const startY = 150; // 爆弾の初期高さ
        const deadLineY = window.innerHeight - 350; // 爆発する高さ（枠の少し上）

        function updateBombPosition(timeLeft) {
            const bomb = document.getElementById('bomb-container');
            const targetBox = document.getElementById('box' + currentTargetIdx);
            
            if (targetBox) {
                // 左右位置：ターゲットの枠の真ん中に合わせる
                const rect = targetBox.getBoundingClientRect();
                const targetX = rect.left + (rect.width / 2) - 100; // 100は爆弾の幅の半分
                bomb.style.left = targetX + 'px';

                // 上下位置：時間経過でstartYからdeadLineYまで落下
                const progress = (30 - timeLeft) / 30;
                const currentY = startY + (deadLineY - startY) * progress;
                bomb.style.top = currentY + 'px';
            }
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d.type === 'setup') {
                document.getElementById('q-title').innerText = d.title;
                const container = document.getElementById('box-container');
                container.innerHTML = '';
                totalQuestions = d.count;
                currentTargetIdx = 1; // 1人目からスタート
                for(let i=1; i<=d.count; i++) {
                    container.innerHTML += `<div class="answer-box" id="box${i}">${i}</div>`;
                }
                document.getElementById('bomb-overlay').style.display = 'none';
                document.getElementById('timer').innerText = "30";
                // 1人目の上にセット
                setTimeout(() => updateBombPosition(30), 100); 
            } else if (d.type === 'tick') {
                document.getElementById('timer').innerText = d.time;
                updateBombPosition(d.time);
            } else if (d.type === 'correct') {
                const box = document.getElementById('box' + d.num);
                if (box) box.classList.add('correct');
                
                // 次の人へ移動
                if (d.num < totalQuestions) {
                    currentTargetIdx = d.num + 1;
                    // 正解した瞬間に横移動（高さはそのまま）
                    const currentTime = parseInt(document.getElementById('timer').innerText);
                    updateBombPosition(currentTime);
                } else {
                    // 全員正解！爆弾を消す（上に逃がす）
                    document.getElementById('bomb-container').style.top = '-300px';
                }
            } else if (d.type === 'bomb') {
                document.getElementById('bomb-overlay').style.display = 'flex';
            } else if (d.type === 'reset') {
                location.reload(); // 状態リセットが確実
            }
        });
    </script>
</body>
</html>
