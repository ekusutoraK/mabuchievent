<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイブボンバー：メインステージ</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; height: 100vh; }
        #q-area { background: rgba(20,20,20,0.95); padding: 25px; border-bottom: 5px solid #f1c40f; z-index: 10; position: relative; }
        #q-title { font-size: 40px; font-weight: bold; color: #f1c40f; margin: 0; }
        #timer-area { position: absolute; top: 120px; right: 40px; z-index: 10; border: 3px solid #ff3e3e; padding: 10px 20px; border-radius: 15px; background: rgba(0,0,0,0.8); }
        #timer { font-size: 80px; color: #ff3e3e; font-weight: bold; font-family: monospace; margin: 0; }
        
        .boxes { display: flex; justify-content: center; gap: 25px; position: absolute; bottom: 70px; width: 100%; z-index: 10; }
        .answer-box { width: 170px; height: 110px; border: 4px solid #444; background: #111; font-size: 50px; display: flex; align-items: center; justify-content: center; border-radius: 15px; transition: 0.3s; color: #333; }
        .correct { background: linear-gradient(145deg, #f1c40f, #e67e22); color: #fff !important; border-color: #fff; box-shadow: 0 0 30px #f1c40f; transform: scale(1.05); }

        #bomb-container { position: absolute; width: 220px; height: 220px; z-index: 5; transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.1s linear; }
        #bomb-image { width: 100%; height: 100%; object-fit: contain; animation: beat 0.8s infinite alternate; }
        @keyframes beat { 0% { transform: scale(1); } 100% { transform: scale(1.15); filter: drop-shadow(0 0 30px red); } }

        #bomb-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(200,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        #bomb-text { font-size: 160px; color: #f1c40f; font-weight: bold; transform: rotate(-10deg); text-shadow: 8px 8px 0px #000; }
    </style>
</head>
<body>
    <div id="q-area"><p id="q-title">READY...</p></div>
    <div id="timer-area"><p id="timer">30</p></div>
    <div id="bomb-container"><img src="./bomb.png" id="bomb-image"></div>
    <div class="boxes" id="box-container"></div>
    <div id="bomb-overlay"><div id="bomb-text">BOMB!! 💣</div></div>

    <script>
        let currentTargetIdx = 1; 
        let totalQuestions = 5;
        let isFinish = false;
        
        const startY = 40; 
        // ★ 380px に設定
        let deadLineY = window.innerHeight - 380; 

        function updateBombPosition(timeLeft) {
            if (isFinish) return; 
            const bomb = document.getElementById('bomb-container');
            const targetBox = document.getElementById('box' + currentTargetIdx);
            if (targetBox) {
                const rect = targetBox.getBoundingClientRect();
                const targetX = rect.left + (rect.width / 2) - 110; 
                bomb.style.left = targetX + 'px';
                
                const progress = (30 - timeLeft) / 30;
                const currentY = startY + (deadLineY - startY) * progress;
                bomb.style.top = currentY + 'px';
            }
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d.type === 'setup') {
                isFinish = false;
                document.getElementById('q-title').innerText = d.title;
                const container = document.getElementById('box-container');
                container.innerHTML = '';
                totalQuestions = d.count;
                currentTargetIdx = 1; 
                for(let i=1; i<=d.count; i++) container.innerHTML += `<div class="answer-box" id="box${i}">${i}</div>`;
                document.getElementById('bomb-overlay').style.display = 'none';
                document.getElementById('bomb-container').style.display = 'block';
                
                const bomb = document.getElementById('bomb-container');
                bomb.style.transition = 'none';
                bomb.style.top = startY + 'px';
                
                deadLineY = window.innerHeight - 380; 

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        bomb.style.transition = 'left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.1s linear';
                        updateBombPosition(30);
                    }, 50);
                });

                document.getElementById('timer').innerText = "30";
            } else if (d.type === 'tick') {
                if (!isFinish) {
                    document.getElementById('timer').innerText = d.time;
                    updateBombPosition(d.time);
                }
            } else if (d.type === 'correct') {
                const box = document.getElementById('box' + d.num);
                if (box) box.classList.add('correct');
                if (d.num < totalQuestions) {
                    currentTargetIdx = d.num + 1;
                    updateBombPosition(parseInt(document.getElementById('timer').innerText));
                } else {
                    isFinish = true;
                    const currentTime = document.getElementById('timer').innerText;
                    document.getElementById('timer').innerText = currentTime;
                    const bomb = document.getElementById('bomb-container');
                    bomb.style.transition = 'top 0.8s ease-in, left 0s'; 
                    setTimeout(() => { bomb.style.top = '-400px'; }, 10);
                }
            } else if (d.type === 'cancel') {
                if (isFinish) return; 
                document.getElementById('box' + d.num).classList.remove('correct');
                currentTargetIdx = d.num; 
                updateBombPosition(parseInt(document.getElementById('timer').innerText));
            } else if (d.type === 'bomb') {
                isFinish = true; 
                const bomb = document.getElementById('bomb-container');
                bomb.style.transition = 'none';
                bomb.style.top = deadLineY + 'px';
                setTimeout(() => {
                    bomb.style.display = 'none';
                    document.getElementById('bomb-overlay').style.display = 'flex';
                }, 100);
            }
        });

        window.onresize = () => {
            deadLineY = window.innerHeight - 380; 
            const currentTime = parseInt(document.getElementById('timer').innerText);
            updateBombPosition(currentTime);
        };
    </script>
</body>
</html>
